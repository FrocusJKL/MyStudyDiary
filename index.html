<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
  <script src="logic-dates.js"></script>
  <script src="logic-heatmap.js"></script>
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
    </header>

    <section class="racha" aria-label="Rachas, minutos de la semana y días del mes">
      <div class="racha-datos">
        <div class="racha-bloque">
          <p class="racha-valor"><span id="racha-numero">0</span> 🔥</p>
          <p class="racha-texto" id="racha-texto">días seguidos</p>
        </div>
        <div class="racha-bloque racha-bloque-mejor">
          <p class="mejor-valor">🏆 <span id="mejor-racha-numero">0</span></p>
          <p class="racha-texto">mejor racha</p>
        </div>
      </div>
      <div class="semana">
        <p class="semana-valor">⏱ <span id="minutos-semana">0 min</span> esta semana</p>
        <p class="semana-valor">📅 <span id="dias-mes">0</span> <span id="dias-mes-texto">días</span> este mes</p>
      </div>
    </section>

    <section class="tarjeta" aria-label="Mapa de calor de estudio de las últimas 12 semanas">
      <h2>Mapa de calor</h2>
      <div class="mapa-con-etiquetas">
        <div class="etiquetas-mapa" aria-hidden="true">
          <span>L</span>
          <span>M</span>
          <span>X</span>
          <span>J</span>
          <span>V</span>
          <span>S</span>
          <span>D</span>
        </div>
        <div id="mapa-rejilla" class="mapa-rejilla"></div>
      </div>
      <div class="leyenda-mapa">
        <span class="mapa-leyenda-texto">menos</span>
        <span class="mapa-muestra nivel-0"></span>
        <span class="mapa-muestra nivel-1"></span>
        <span class="mapa-muestra nivel-2"></span>
        <span class="mapa-muestra nivel-3"></span>
        <span class="mapa-muestra nivel-4"></span>
        <span class="mapa-leyenda-texto">más</span>
      </div>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" name="tema" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" name="minutos" min="1" max="1440" step="1" required>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Sesiones</h2>
      <ul id="lista-sesiones" class="lista-sesiones"></ul>
      <p id="sin-sesiones" class="sin-sesiones">Todavía no hay sesiones: anota la primera en el formulario.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
